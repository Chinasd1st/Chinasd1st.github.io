version: 2

# 依赖更新的节奏与边界。
#
# 背景(基于 58 个 PR 的实际数据):之前是 daily + 两个 group,但 PR 从不合并,
# 于是分组 PR 被下一批更新不断取代重建 —— 58 个 PR 里有 32 个(55%)是同两个
# group PR 的重复产物,41 个被关闭且从未合并,而且每个重建版本都更大、更容易冲突
# (#58 仅开 0.6 天就已 +346/-359)。这属于"每天生成、永不消费"的最差组合。
#
# 改动要点:
#   1. daily -> weekly:噪音直接降一个数量级,且分组 PR 有机会在被取代前被处理。
#   2. open-pull-requests-limit: 2:最多同时存在两个 PR(正好对应两个 group)。
#   3. ignore js-yaml:该依赖由 pnpm-workspace.yaml 的 overrides 手工固定在 3.15.1,
#      Dependabot 对"同名双 override"解析必然失败。
#   4. 保护 0.x 依赖的 minor 跳变:katex 0.16 -> 0.18 会被 semver 判为 minor,
#      但对 0.x 库通常是破坏性变更。
#
# 注意:**安全更新不受此 schedule 影响**。GitHub 的安全更新有独立调度,
# 仍会在披露后立即开 PR,所以改成 weekly 不会延迟 CVE 修复。
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "Asia/Shanghai"

    # 同时最多两个 PR:与下面两个 group 一一对应,避免堆积出新的"僵尸 PR"。
    open-pull-requests-limit: 2

    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"

    pull-request-branch-name:
      separator: "-"

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # 这里刻意不 ignore js-yaml / katex。
      #
      # 曾经的考虑是"这两个包的更新必然失败或语义不成立,不如忽略以减少噪音":
      #   js-yaml  gray-matter@4 只支持 3.x,与 js-yaml@^4 的 override 并存,
      #             同名双 override 让 Dependabot 报 dependency_file_not_resolvable
      #   katex    lockfile 里 0.16.47(mermaid 传递,声明 ^0.16.25)与 0.18.4
      #             (直接依赖)并存,更新要越过 mermaid 的声明范围
      #
      # 但这两个包当时都带着**未修复的安全告警**:
      #   js-yaml        high   < 3.15.2 / < 4.3.2(两条线各一个)
      #   katex          low    < 0.18.2(命中的是 mermaid 的传递副本)
      # 失败的运行恰恰是 command=security 的安全更新任务,也就是说:
      # 忽略它们等于亲手掐掉安全修复的唯一自动路径。宁可让运行继续失败(可见),
      # 也不要让它静默消失。真正的修复手段是 pnpm-workspace.yaml 的 overrides
      # 或合并对应的 PR,而不是 ignore。

