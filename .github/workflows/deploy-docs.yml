name: 部署文档

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 连推两次时「排队」而不是互相取消。
# cancel-in-progress 只能取消尚未进入部署的运行，打断不了已经开始的 Pages 发布，
# 于是后一次会撞上 GitHub 的 "in progress deployment" 400 错误（实测过一次：
# 连续合并多个 PR 时 deploy-pages 直接失败，而构建本身是成功的）。
# 改成排队后每次推送都有确定结果，代价是突发推送需要按顺序等待，单作者场景可忽略。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# 默认给最小权限：只有真正需要 Pages 写入与 OIDC 的 deploy job 才提升。
# 这样构建步骤手里没有 pages: write / id-token: write —— 而它要执行
# pnpm install，进而运行 esbuild、@parcel/watcher 的第三方 postinstall 脚本。
permissions:
  contents: read

jobs:
  # 构建与部署拆成两个 job：
  #  1. 部署失败时 "Re-run failed jobs" 只重跑部署，不必重新构建（约 2 分钟）；
  #  2. 失败时能一眼区分是「构建挂了」还是「部署挂了」。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 是必需的：主题的 lastUpdated / changelog 依赖完整 git 历史。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # run_install: false —— 默认行为会自行跑一次依赖安装，与下面的显式安装重复；
      # 关掉后这一步只负责放置 pnpm 本身（实测可省约 9s）。
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Vite 的依赖预打包缓存：key 加入 lockfile 与 package.json，
      # restore-keys 提供前缀回退，避免每次依赖变动都从零重建。
      - name: 缓存 Vite 构建缓存
        uses: actions/cache@v5
        with:
          path: src/.vuepress/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 构建 VuePress 文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm docs:build

      # dist 下存在 ./img/2026.10.7 这类「点开头」的目录，Jekyll 会忽略它们，
      # 因此必须保留 .nojekyll。
      - run: touch src/.vuepress/dist/.nojekyll

      # v5 起为 composite action（v4 依赖 node20）。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # 只有这个 job 需要写入 Pages 与铸造 OIDC token。
    permissions:
      pages: write
      id-token: write

    steps:
      # deploy-pages@v5 起原生使用 node24（v4 是 node20），
      # 因此不再需要 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 这个兼容开关。
      - uses: actions/deploy-pages@v5
        id: deployment
